<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
        name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no"
    >

    <title>NEW GROUNDS</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: black;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            display: none;
        }

        #unity-progress-bar-empty {
            width: 100%;
            height: 20px;
            background: #222;
            border: 1px solid #555;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: white;
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="unity-container">

    <canvas
        id="unity-canvas"
        tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>

    <div id="unity-warning"></div>

</div>

<script>
    const canvas =
        document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
        const warningBanner =
            document.querySelector("#unity-warning");

        const div =
            document.createElement("div");

        div.innerHTML = msg;

        if (type === "error") {
            div.style.background = "red";
            div.style.color = "white";
            div.style.padding = "10px";
        } else if (type === "warning") {
            div.style.background = "yellow";
            div.style.color = "black";
            div.style.padding = "10px";
        }

        warningBanner.appendChild(div);

        if (type !== "error") {
            setTimeout(() => {
                div.remove();
            }, 5000);
        }
    }

    const buildUrl = "Build";

    const loaderUrl =
        buildUrl + "/build.loader.js";

    const config = {
        arguments: [],

        dataUrl:
            buildUrl + "/build.data",

        frameworkUrl:
            buildUrl + "/build.framework.js",

        codeUrl:
            buildUrl + "/build.wasm",

        streamingAssetsUrl:
            "StreamingAssets",

        companyName:
            "DefaultCompany",

        productName:
            "NEW GROUNDS",

        productVersion:
            "0.1.0",

        showBanner:
            unityShowBanner
    };

    document
        .querySelector("#unity-loading-bar")
        .style.display = "block";

    const script =
        document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {

        createUnityInstance(
            canvas,
            config,
            (progress) => {

                document
                    .querySelector(
                        "#unity-progress-bar-full"
                    )
                    .style.width =
                    (progress * 100) + "%";
            }
        )
        .then((unityInstance) => {

            document
                .querySelector("#unity-loading-bar")
                .style.display = "none";

        })
        .catch((message) => {

            alert(message);

        });
    };

    document.body.appendChild(script);
</script>

</body>
</html>
